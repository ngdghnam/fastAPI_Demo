<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error 404: Path not Found</title>
    <link rel="stylesheet" href="static/css/error404.css" />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      html {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f2f2f2;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      .page {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="content">
        <div class="img-container">
          <img src="static/imgs/img_1.jpg" alt="" class="problem-img" />
        </div>
        <div class="more-info-container">
          <h1 class="problem-title">
            Hmm, Look like you've wandered off the digital path
          </h1>
          <p class="problem-desc">
            In the labyrinth of cyberspace, even the most experienced travelers
            can stumble upon dead ends. Take a moment to reorient yourself or
            return to the homepage to chart a new course.
          </p>
          <!-- Buttons -->
          <div class="btns-grp">
            <button class="back-btn"><a href="/">Back to home</a></button>
            <button class="help-btn">Visit help center</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
